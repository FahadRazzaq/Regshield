services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes: 
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=grafana-image-renderer

  airflow:
    image: apache/airflow:2.9.1
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    command: standalone
    volumes:
      - C:/Users/hp/Downloads/Regshield/airflow_dags:/opt/airflow/dags