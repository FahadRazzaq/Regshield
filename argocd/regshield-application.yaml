apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regshield
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FahadRazzaq/Regshield.git
    targetRevision: main
    path: k8s/regshield
  destination:
    server: https://kubernetes.default.svc
    namespace: regshield
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true