apiVersion: apps/v1
kind: Deployment
metadata:
  name: regshield-api
  namespace: regshield

spec:
  replicas: 1

  selector:
    matchLabels:
      app: regshield-api

  template:
    metadata:
      labels:
        app: regshield-api

    spec:
      containers:
        - name: regshield-api
          image: regshield-api:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
            - containerPort: 5001

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6