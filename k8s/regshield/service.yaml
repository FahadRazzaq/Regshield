apiVersion: v1
kind: Service
metadata:
  name: regshield-api-service
  namespace: regshield
spec:
  type: NodePort
  selector:
    app: regshield-api
  ports:
    - name: api
      port: 8000
      targetPort: 8000
      nodePort: 30080
    - name: ui
      port: 5001
      targetPort: 5001
      nodePort: 30051