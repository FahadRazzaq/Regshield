apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.17.0
        ports:
        - containerPort: 5000
        command: ["mlflow"]
        args: ["server", "--host", "0.0.0.0", "--port", "5000"]
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlflow
spec:
  selector:
    app: mlflow
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: LoadBalancer